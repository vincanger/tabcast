# Local S3 for development. MinIO speaks the S3 API, so the app talks to it
# with the same client and presigned URLs it uses against a real bucket.
#
#   docker compose up -d
#
# Console at http://localhost:9001 (minioadmin / minioadmin) to browse and play
# the generated episodes. Set the S3_* values in app/.env.server to match.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # The dashboard plays audio straight from a presigned URL, so the browser
      # needs CORS. This is MinIO's default, set here so it is visible.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data

  # Creates the bucket on first run, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/article-podcast
      "

volumes:
  minio-data:
