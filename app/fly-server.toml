# fly.toml app configuration file generated for tabcast-server on 2026-09-22T14:28:16+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tabcast-server'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  # Episodes are generated inside this process by pg-boss, and Fly judges
  # idleness by HTTP traffic, so a stopped machine would take its job down
  # with it. Keep the server running, and run one machine: the app was
  # scaled to one with `fly scale count 1`.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
